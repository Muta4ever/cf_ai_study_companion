<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Study Companion</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 700px;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  height: 90vh;
  max-height: 700px;
}

.header {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  padding: 25px 30px;
  text-align: center;
}

.header h1 {
  font-size: 28px;
  font-weight: 600;
  margin-bottom: 5px;
}

.header p {
  font-size: 14px;
  opacity: 0.9;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 15px;
  background: #f8f9fa;
}

#chat::-webkit-scrollbar {
  width: 8px;
}
#chat::-webkit-scrollbar-track { background: #f1f1f1; }
#chat::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
#chat::-webkit-scrollbar-thumb:hover { background: #555; }

.message {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  animation: slideIn 0.3s ease-out;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.message.user { flex-direction: row-reverse; }

.avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 16px;
  flex-shrink: 0;
}
.message.user .avatar {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
}
.message.assistant .avatar {
  background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  color: white;
}

.message-content {
  max-width: 70%;
  padding: 12px 16px;
  border-radius: 18px;
  line-height: 1.5;
  font-size: 15px;
  word-wrap: break-word;
}
.message.user .message-content {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border-bottom-right-radius: 4px;
}
.message.assistant .message-content {
  background: white;
  color: #333;
  border-bottom-left-radius: 4px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

.input-area {
  padding: 20px;
  background: white;
  border-top: 1px solid #e0e0e0;
}

#inputForm {
  display: flex;
  gap: 10px;
  align-items: center;
}

.input-wrapper {
  flex: 1;
  display: flex;
  gap: 8px;
}

#messageInput {
  flex: 1;
  padding: 14px 18px;
  border: 2px solid #e0e0e0;
  border-radius: 25px;
  font-size: 15px;
  outline: none;
  transition: all 0.3s ease;
  background: #f8f9fa;
}
#messageInput:focus {
  border-color: #667eea;
  background: white;
  box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

.file-upload-wrapper {
  position: relative;
  overflow: hidden;
}

#fileInput {
  position: absolute;
  left: -9999px;
  opacity: 0;
}

.file-upload-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 12px 18px;
  border-radius: 25px;
  border: 2px solid #e0e0e0;
  background: white;
  color: #667eea;
  cursor: pointer;
  transition: all 0.3s ease;
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
}

.file-upload-btn:hover {
  border-color: #667eea;
  background: #f8f9fa;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
}

.file-upload-btn svg {
  width: 18px;
  height: 18px;
}

.file-upload-btn.has-file {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border-color: #667eea;
}

#sendBtn {
  padding: 14px 28px;
  border: none;
  border-radius: 25px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  font-size: 15px;
  box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
  white-space: nowrap;
}
#sendBtn:hover { 
  transform: translateY(-2px); 
  box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6); 
}
#sendBtn:active { transform: translateY(0); }
#sendBtn:disabled { 
  opacity: 0.6; 
  cursor: not-allowed; 
  transform: none; 
}

.typing-indicator { display: none; align-items: center; gap: 12px; }
.typing-indicator.active { display: flex; }
.typing-dots { display: flex; gap: 4px; padding: 12px 16px; background: white; border-radius: 18px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); }
.typing-dots span { width: 8px; height: 8px; border-radius: 50%; background: #667eea; animation: bounce 1.4s infinite ease-in-out; }
.typing-dots span:nth-child(1) { animation-delay: -0.32s; }
.typing-dots span:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounce {
  0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
  40% { transform: scale(1); opacity: 1; }
}

.empty-state {
  text-align: center;
  color: #999;
  padding: 40px 20px;
}
.empty-state svg { width: 80px; height: 80px; margin-bottom: 15px; opacity: 0.3; }
.empty-state h3 { font-size: 18px; margin-bottom: 8px; color: #666; }
.empty-state p { font-size: 14px; }

.file-indicator {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: #e8f0fe;
  border-radius: 15px;
  font-size: 13px;
  color: #667eea;
  margin-top: 8px;
}

.file-indicator.active {
  display: flex;
}

.file-indicator svg {
  width: 16px;
  height: 16px;
}

.file-indicator .remove-file {
  margin-left: 4px;
  cursor: pointer;
  color: #f5576c;
  font-weight: bold;
}

@media (max-width: 600px) {
  #inputForm {
    flex-wrap: wrap;
  }
  
  .input-wrapper {
    width: 100%;
  }
  
  #sendBtn {
    flex: 1;
  }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>✨ AI Study Companion</h1>
    <p>Your intelligent learning assistant</p>
  </div>

  <div id="chat">
    <div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
      <h3>Start a conversation</h3>
      <p>Ask me anything about your studies!</p>
    </div>
  </div>

  <div class="input-area">
    <form id="inputForm">
      <div class="input-wrapper">
        <input type="text" id="messageInput" placeholder="Ask me anything..." required />
        
        <div class="file-upload-wrapper">
          <input type="file" id="fileInput" accept=".txt,.pdf" />
          <label for="fileInput" class="file-upload-btn" id="fileLabel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
            </svg>
            <span id="fileLabelText">Upload</span>
          </label>
        </div>
      </div>
      
      <button type="submit" id="sendBtn">Send</button>
    </form>
    
    <div class="file-indicator" id="fileIndicator">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"></path>
        <path d="M14 2v6h6M12 18v-6M9 15l3 3 3-3" stroke="white" stroke-width="1.5" fill="none"></path>
      </svg>
      <span id="fileName">document.pdf</span>
      <span class="remove-file" id="removeFile">×</span>
    </div>
  </div>
</div>

<script>
const chatBox = document.getElementById("chat");
const form = document.getElementById("inputForm");
const input = document.getElementById("messageInput");
const fileInput = document.getElementById("fileInput");
const sendBtn = document.getElementById("sendBtn");
const fileLabel = document.getElementById("fileLabel");
const fileLabelText = document.getElementById("fileLabelText");
const fileIndicator = document.getElementById("fileIndicator");
const fileName = document.getElementById("fileName");
const removeFile = document.getElementById("removeFile");
const userId = "demo";

let typingIndicator = null;
let currentFile = null;

// File input handling
fileInput.addEventListener("change", (e) => {
  if (e.target.files.length > 0) {
    currentFile = e.target.files[0];
    fileLabel.classList.add("has-file");
    fileLabelText.textContent = "✓";
    fileIndicator.classList.add("active");
    fileName.textContent = currentFile.name;
  }
});

removeFile.addEventListener("click", () => {
  currentFile = null;
  fileInput.value = "";
  fileLabel.classList.remove("has-file");
  fileLabelText.textContent = "Upload";
  fileIndicator.classList.remove("active");
});

function clearEmptyState() {
  const emptyState = chatBox.querySelector('.empty-state');
  if (emptyState) emptyState.remove();
}

function createTypingIndicator() {
  const wrapper = document.createElement("div");
  wrapper.className = "message assistant typing-indicator";
  wrapper.innerHTML = `
    <div class="avatar">AI</div>
    <div class="typing-dots">
      <span></span>
      <span></span>
      <span></span>
    </div>
  `;
  return wrapper;
}

function addMessage(text, role) {
  clearEmptyState();
  if (typingIndicator) { typingIndicator.remove(); typingIndicator = null; }

  const wrapper = document.createElement("div");
  wrapper.className = "message " + role;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "You" : "AI";

  const content = document.createElement("div");
  content.className = "message-content";
  content.textContent = text;

  wrapper.appendChild(avatar);
  wrapper.appendChild(content);
  chatBox.appendChild(wrapper);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function showTyping() {
  clearEmptyState();
  typingIndicator = createTypingIndicator();
  chatBox.appendChild(typingIndicator);
  setTimeout(() => {
    if (typingIndicator) typingIndicator.classList.add('active');
    chatBox.scrollTop = chatBox.scrollHeight;
  }, 10);
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;

  addMessage(message, "user");
  input.value = "";
  sendBtn.disabled = true;
  showTyping();

  let uploadedDocText = "";
  if (currentFile) {
    uploadedDocText = await currentFile.text();
  }

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId, message, doc: uploadedDocText })
    });
    
    if (!res.ok) {
      console.error("Server error:", res.status, res.statusText);
    }
    
    let data;
    try {
      data = await res.json();
    } catch (jsonError) {
      console.error("JSON parse error:", jsonError);
      const text = await res.text();
      console.error("Response text:", text);
      throw new Error("Invalid JSON response from server");
    }
    
    if (data && data.reply) {
      addMessage(data.reply, "assistant");
    } else {
      throw new Error("No reply in response");
    }
    
  } catch (err) {
    console.error("Error:", err);
    addMessage("Sorry, I encountered an error. Please try again.", "assistant");
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});

input.focus();
</script>
</body>
</html>
